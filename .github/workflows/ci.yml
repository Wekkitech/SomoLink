name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Install dependencies
        run: pnpm install

      - name: Lint (if defined)
        run: pnpm lint || echo "no lint script defined, skipping"

      - name: Run tests (if defined)
        run: pnpm test || echo "no test script defined, skipping"

      # Optional: build frontends
      - name: Build school dashboard
        run: |
          cd apps/school-dashboard
          pnpm install
          pnpm build || echo "school-dashboard build skipped"

      - name: Build community portal
        run: |
          cd apps/community-portal
          pnpm install
          pnpm build || echo "community-portal build skipped"

      - name: Build admin dashboard
        run: |
          cd apps/admin-dashboard
          pnpm install
          pnpm build || echo "admin-dashboard build skipped"
