name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Linting and Code Quality
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - edge-agent
          - ai-platform
          - api-gateway
          - school-dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go (Edge Agent)
        if: matrix.component == 'edge-agent'
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache-dependency-path: services/edge-agent/go.sum

      - name: Lint Go code
        if: matrix.component == 'edge-agent'
        run: |
          cd services/edge-agent
          go fmt ./...
          go vet ./...
          # Install and run golangci-lint
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.54.2
          golangci-lint run

      - name: Setup Python (AI Platform)
        if: matrix.component == 'ai-platform'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Lint Python code
        if: matrix.component == 'ai-platform'
        run: |
          cd services/ai-platform
          pip install flake8 black isort mypy
          flake8 . --max-line-length=100 --exclude=venv
          black --check .
          isort --check-only .
          mypy . --ignore-missing-imports

      - name: Setup Node.js (Gateway & Frontend)
        if: matrix.component == 'api-gateway' || matrix.component == 'school-dashboard'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install pnpm
        if: matrix.component == 'api-gateway' || matrix.component == 'school-dashboard'
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Lint TypeScript code
        if: matrix.component == 'api-gateway' || matrix.component == 'school-dashboard'
        run: |
          pnpm install
          pnpm lint
          pnpm type-check

  # Unit Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        component:
          - edge-agent
          - ai-platform
          - api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test Edge Agent (Go)
        if: matrix.component == 'edge-agent'
        run: |
          cd services/edge-agent
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -html=coverage.out -o coverage.html

      - name: Test AI Platform (Python)
        if: matrix.component == 'ai-platform'
        run: |
          cd services/ai-platform
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio
          pytest --cov=. --cov-report=xml --cov-report=html

      - name: Test API Gateway (Node.js)
        if: matrix.component == 'api-gateway'
        run: |
          cd services/api-gateway
          pnpm install
          pnpm test:cov

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml,./coverage.out
          flags: ${{ matrix.component }}
          name: ${{ matrix.component }}-coverage

  # Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # Build Docker Images
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push'
    strategy:
      matrix:
        service:
          - edge-agent
          - ai-platform
          - api-gateway
          - data-ingestion
          - billing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:buildcache,mode=max

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.somolink.wekkitech.co.ke

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy to Kubernetes (Staging)
        run: |
          kubectl set image deployment/api-gateway api-gateway=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api-gateway:develop -n staging
          kubectl set image deployment/ai-platform ai-platform=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ai-platform:develop -n staging
          kubectl rollout status deployment/api-gateway -n staging
          kubectl rollout status deployment/ai-platform -n staging

      - name: Run smoke tests
        run: |
          kubectl run smoke-test --image=curlimages/curl --rm -i --restart=Never -- \
            curl -f http://api-gateway.staging.svc.cluster.local:3000/health

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://somolink.wekkitech.co.ke

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy to Kubernetes (Production)
        run: |
          # Use Helm for production deployments
          helm upgrade --install somolink ./infrastructure/helm/charts/somolink \
            --namespace production \
            --values infrastructure/helm/values/production.yaml \
            --set image.tag=${{ github.sha }}

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/api-gateway -n production
          kubectl rollout status deployment/ai-platform -n production

      - name: Run integration tests
        run: |
          kubectl run integration-test --image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/test-runner:latest \
            --rm -i --restart=Never -- pytest tests/integration

      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: 'Production deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ML Model Training (Scheduled)
  ml-training:
    name: ML Model Retraining
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd services/ai-platform
          pip install -r requirements.txt
          pip install mlflow

      - name: Trigger model retraining
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd services/ai-platform/training
          python retrain_solar_model.py
          python retrain_qos_model.py
          python retrain_anomaly_model.py

      - name: Deploy updated models
        run: |
          # Models are automatically versioned in MLflow
          # Update model serving endpoints
          echo "Models retrained and registered in MLflow"
