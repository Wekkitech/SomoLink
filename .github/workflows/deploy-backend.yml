name: Build and Deploy Backend

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    name: Build and Deploy Spring Boot Backend
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Make mvnw executable
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      # Step 3: Setup JDK 17
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      # Step 4: Run unit tests (optional)
      - name: Run unit tests
        run: ./mvnw test -B

      # Step 5: Build Spring Boot JAR
      - name: Build backend app
        run: ./mvnw clean package -B -DskipTests

      # Step 6: Copy JAR to VM
      - name: Copy backend JAR to VM
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          source: target/somolink-*.jar
          target: ${{ secrets.VM_BACKEND_PATH }}

      # Step 7: Run deploy script on VM
      - name: Run deploy script on VM
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          script: |
            bash ${{ secrets.VM_DEPLOY_SCRIPT }}
