name: Build and Deploy Backend

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    name: Build and Deploy Spring Boot Backend
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Make mvnw executable
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      # Step 3: Setup JDK 17
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      # Step 4: Debug – show build environment
      - name: Debug build environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          pwd
          ls -la

      # Step 5: Run unit tests
      - name: Run the unit tests
        run: ./mvnw test -B

      # Step 6: Build Spring Boot JAR
      - name: Build backend app
        run: ./mvnw clean package -B -DskipTests

      # Step 7: Debug – confirm JAR exists
      - name: Debug build output
        run: |
          echo "Listing target directory:"
          ls -lh target/
          echo "Matching JARs:"
          ls target/somolink-*.jar || echo "NO JAR FOUND"

      # Step 8: Debug – check secrets presence (NOT values)
      - name: Debug secrets presence
        run: |
          echo "VM_HOST is set: ${{ secrets.VM_HOST != '' }}"
          echo "VM_USER is set: ${{ secrets.VM_USER != '' }}"
          echo "VM_SSH_PORT is set: ${{ secrets.VM_SSH_PORT != '' }}"
          echo "VM_BACKEND_PATH is set: ${{ secrets.VM_BACKEND_PATH != '' }}"
          echo "VM_DEPLOY_SCRIPT is set: ${{ secrets.VM_DEPLOY_SCRIPT != '' }}"

      # Step 9: Debug – test SSH connectivity
      - name: Test SSH connection
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          script: |
            echo "Connected successfully"
            echo "Remote user: $(whoami)"
            echo "Remote host: $(hostname)"
            pwd
            ls -la

      # Step 10: Copy JAR to VM
      - name: Copy backend JAR to VM
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          source: target/somolink-*.jar
          target: ${{ secrets.VM_BACKEND_PATH }}

      # Step 11: Run deploy script on VM
      - name: Run deploy script on VM
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          script: |
            echo "Running deploy script at:"
            echo "${{ secrets.VM_DEPLOY_SCRIPT }}"
            bash ${{ secrets.VM_DEPLOY_SCRIPT }}
