name: Build and Deploy Backend

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build Spring Boot application
        run: ./mvnw clean package -B -DskipTests

      # 1️⃣ Remove old JAR on VM
      - name: Remove old backend JAR on VM
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          script: |
            rm -f ${{ secrets.VM_BACKEND_PATH }}/somolink-*.jar

      # 2️⃣ Copy new JAR to VM
      - name: Copy backend JAR to VM
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          source: target/somolink-*.jar
          target: ${{ secrets.VM_BACKEND_PATH }}

      # 3️⃣ Run deploy script
      - name: Run deploy script on VM
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT }}
          script: |
            bash ${{ secrets.VM_DEPLOY_SCRIPT }}
