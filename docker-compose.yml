version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: somolink-postgres
    environment:
      POSTGRES_DB: somolink
      POSTGRES_USER: somolink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U somolink"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - somolink-network

  # TimescaleDB (for telemetry time-series data)
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: somolink-timescale
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: somolink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U somolink"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - somolink-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: somolink-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - somolink-network

  # Apache Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: somolink-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - somolink-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: somolink-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - somolink-network

  # MinIO (S3-compatible object storage)
  minio:
    image: minio/minio:latest
    container_name: somolink-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - somolink-network

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: somolink-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - somolink-network

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: somolink-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./configs/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - somolink-network

  # Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: somolink-jaeger
    ports:
      - "6831:6831/udp"
      - "16686:16686"
      - "14268:14268"
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
    networks:
      - somolink-network

  # MLflow (ML Experiment Tracking)
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: somolink-mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://somolink:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/mlflow
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: mlflow server --backend-store-uri ${MLFLOW_BACKEND_STORE_URI} --default-artifact-root s3://mlflow --host 0.0.0.0
    depends_on:
      - postgres
      - minio
    networks:
      - somolink-network

  # API Gateway (NestJS)
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: somolink-api-gateway
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://somolink:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/somolink
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      AI_PLATFORM_URL: ai-platform:8000
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - somolink-network
    volumes:
      - ./services/api-gateway:/app
      - /app/node_modules

  # AI Platform (FastAPI)
  ai-platform:
    build:
      context: ./services/ai-platform
      dockerfile: Dockerfile
    container_name: somolink-ai-platform
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: postgresql://somolink:${POSTGRES_PASSWORD:-dev_password}@timescaledb:5432/telemetry
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_PATH: /models
      REDIS_URL: redis://redis:6379
    volumes:
      - ./services/ai-platform:/app
      - ml_models:/models
    depends_on:
      - timescaledb
      - redis
      - mlflow
    networks:
      - somolink-network

  # Data Ingestion Service
  data-ingestion:
    build:
      context: ./services/data-ingestion
      dockerfile: Dockerfile
    container_name: somolink-data-ingestion
    ports:
      - "8001:8000"
    environment:
      KAFKA_BROKERS: kafka:9092
      TIMESCALEDB_URL: postgresql://somolink:${POSTGRES_PASSWORD:-dev_password}@timescaledb:5432/telemetry
      REDIS_URL: redis://redis:6379
    depends_on:
      - kafka
      - timescaledb
      - redis
    networks:
      - somolink-network

volumes:
  postgres_data:
  timescale_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  ml_models:

networks:
  somolink-network:
    driver: bridge
