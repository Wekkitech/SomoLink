{{- range $service := list "apiGateway" "aiPlatform" "billing" "dataIngestion" "schoolDashboard" }}
{{- $config := index $.Values $service }}
{{- if $config.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $service | kebabcase }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $service | kebabcase }}
    component: {{ $service }}
    environment: {{ $.Values.global.environment }}
spec:
  replicas: {{ $config.replicaCount }}
  selector:
    matchLabels:
      app: {{ $service | kebabcase }}
  template:
    metadata:
      labels:
        app: {{ $service | kebabcase }}
        component: {{ $service }}
    spec:
      {{- if $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.securityContext | nindent 8 }}
      containers:
      - name: {{ $service | kebabcase }}
        image: "{{ $.Values.global.imageRegistry }}/{{ $config.image.repository }}:{{ $config.image.tag }}"
        imagePullPolicy: {{ $config.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ $config.service.port }}
          protocol: TCP
        {{- if $config.env }}
        env:
        {{- range $key, $value := $config.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        resources:
          {{- toYaml $config.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
{{- end }}
{{- end }}
