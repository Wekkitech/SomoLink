apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: somolink-ingress
  namespace: somolink
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  tls:
  - hosts:
    - api.somolink.ke
    - app.somolink.ke
    - admin.somolink.ke
    secretName: somolink-tls
  rules:
  # API Gateway
  - host: api.somolink.ke
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 3001
  
  # AI Platform
  - host: api.somolink.ke
    http:
      paths:
      - path: /ai
        pathType: Prefix
        backend:
          service:
            name: ai-platform
            port:
              number: 8000
  
  # Billing Service
  - host: api.somolink.ke
    http:
      paths:
      - path: /billing
        pathType: Prefix
        backend:
          service:
            name: billing
            port:
              number: 3003
  
  # School Dashboard
  - host: app.somolink.ke
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: school-dashboard
            port:
              number: 3000
  
  # Admin Dashboard
  - host: admin.somolink.ke
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-dashboard
            port:
              number: 3002
