# Alert rules for SomoLink infrastructure
groups:
  - name: edge_devices
    interval: 30s
    rules:
      - alert: DeviceBatteryLow
        expr: battery_soc < 20
        for: 5m
        labels:
          severity: warning
          component: edge
        annotations:
          summary: "Device {{ $labels.device_id }} battery low"
          description: "Battery at {{ $value }}%, device may shut down soon"
      
      - alert: DeviceBatteryCritical
        expr: battery_soc < 10
        for: 2m
        labels:
          severity: critical
          component: edge
        annotations:
          summary: "Device {{ $labels.device_id }} battery critical"
          description: "Battery at {{ $value }}%, immediate shutdown risk"
      
      - alert: DeviceOffline
        expr: up{job="edge-devices"} == 0
        for: 10m
        labels:
          severity: warning
          component: edge
        annotations:
          summary: "Device {{ $labels.device_id }} is offline"
          description: "No telemetry received for 10 minutes"
      
      - alert: HighCPUTemperature
        expr: cpu_temp_celsius > 75
        for: 5m
        labels:
          severity: warning
          component: edge
        annotations:
          summary: "High CPU temperature on {{ $labels.device_id }}"
          description: "CPU temperature is {{ $value }}°C"

  - name: services
    interval: 15s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 2 minutes"
      
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate in {{ $labels.job }}"
          description: "Error rate is {{ $value }} errors/sec"
      
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency in {{ $labels.job }}"
          description: "95th percentile latency is {{ $value }}s"

  - name: database
    interval: 30s
    rules:
      - alert: DatabaseDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL is down"
          description: "Cannot connect to PostgreSQL database"
      
      - alert: HighDatabaseConnections
        expr: pg_stat_database_numbackends > 80
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High number of database connections"
          description: "{{ $value }} connections active"
      
      - alert: SlowQueries
        expr: rate(pg_stat_statements_mean_time_seconds[5m]) > 1
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Slow database queries detected"
          description: "Average query time is {{ $value }}s"

  - name: kafka
    interval: 30s
    rules:
      - alert: KafkaDown
        expr: kafka_server_running == 0
        for: 2m
        labels:
          severity: critical
          component: kafka
        annotations:
          summary: "Kafka broker is down"
          description: "Kafka broker {{ $labels.instance }} is not running"
      
      - alert: KafkaConsumerLag
        expr: kafka_consumer_lag > 10000
        for: 5m
        labels:
          severity: warning
          component: kafka
        annotations:
          summary: "High consumer lag in {{ $labels.topic }}"
          description: "Consumer lag is {{ $value }} messages"

  - name: ml_models
    interval: 60s
    rules:
      - alert: ModelPredictionLatency
        expr: histogram_quantile(0.95, rate(model_prediction_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          component: ai
        annotations:
          summary: "High ML model latency"
          description: "95th percentile prediction time is {{ $value }}s for {{ $labels.model }}"
      
      - alert: ModelAccuracyDrop
        expr: model_accuracy < 0.7
        for: 10m
        labels:
          severity: warning
          component: ai
        annotations:
          summary: "Model accuracy degradation"
          description: "{{ $labels.model }} accuracy dropped to {{ $value }}"

  - name: system
    interval: 30s
    rules:
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value }}%"
      
      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage on {{ $labels.instance }}"
          description: "Disk usage is {{ $value }}% on {{ $labels.mountpoint }}"
      
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value }}%"
